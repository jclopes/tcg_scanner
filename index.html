<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TCG Scanner</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        --bg: #111;
        --panel-bg: #1a1a1a;
        --panel-border: #2e2e2e;
        --text: #eee;
        --text-muted: #999;
        --accent: #38e082;
        --accent-text: #111;
        --danger: #ff7b7b;
        --control-bg: #222;
        --control-border: #444;
        --radius: 8px;
        --radius-sm: 6px;
        --gap: 0.75rem;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 1rem;
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        gap: 1rem;
        align-items: flex-start;
      }

      #app {
        max-width: 480px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      h1 {
        font-size: 1.1rem;
        margin: 0;
      }

      #status {
        min-height: 1.2em;
        margin: 0;
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      #status[data-kind="error"] {
        color: var(--danger);
      }

      #camera-stage {
        position: relative;
        width: 100%;
        /* Initial guess before the video's real dimensions are known —
           matches every CAMERA_RESOLUTION_OPTIONS entry's own 16:9 shape
           (config.ts). Kept in sync with the live video's actual intrinsic
           size in JS (src/shell/app.ts) once it loads, so the guide-overlay
           canvas — sized to that same intrinsic pixel dimensions — maps 1:1
           onto the video with no letterboxing/cropping mismatch between the
           two. */
        aspect-ratio: 16 / 9;
        background: #000;
        overflow: hidden;
        border-radius: var(--radius);
      }

      #camera-video,
      #guide-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #camera-video {
        object-fit: cover;
      }

      #resolution-status {
        margin: -0.5rem 0 0;
        font-size: 0.8rem;
        color: var(--text-muted);
        text-align: right;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #settings {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        padding: 0.85rem;
        border: 1px solid var(--panel-border);
        border-radius: var(--radius);
        background: var(--panel-bg);
      }

      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--gap);
      }

      .setting-row label {
        font-size: 0.85rem;
        color: #ccc;
      }

      .setting-select {
        flex: 1 1 auto;
        max-width: 65%;
        padding: 0.4rem 0.6rem;
        font-size: 0.9rem;
        border: 1px solid var(--control-border);
        background: var(--control-bg);
        color: var(--text);
        border-radius: var(--radius-sm);
      }

      .setting-select:disabled {
        opacity: 0.6;
      }

      .debug-toggle {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.85rem;
        color: #ccc;
      }

      #actions {
        display: flex;
        justify-content: center;
      }

      #scan-button {
        width: 100%;
        padding: 0.7rem 1.25rem;
        font-size: 1rem;
        border-radius: var(--radius);
        border: none;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
      }

      #scan-button:disabled {
        background: #555;
        color: #999;
      }

      #result {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      #result[hidden] {
        display: none;
      }

      #result h2 {
        font-size: 1rem;
        margin: 0;
      }

      #result img {
        max-width: 100%;
        border-radius: var(--radius);
        background: #000;
      }

      #debug-controls {
        display: flex;
        justify-content: flex-end;
      }

      #debug-controls[hidden] {
        display: none;
      }

      #debug-force-button {
        padding: 0.4rem 0.75rem;
        font-size: 0.85rem;
        border: 1px solid var(--control-border);
        background: var(--control-bg);
        color: var(--text);
        border-radius: var(--radius-sm);
      }

      #debug-force-button:disabled {
        color: #666;
        border-color: #333;
      }

      #debug-panel {
        width: 220px;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      #debug-panel[hidden] {
        display: none;
      }

      #debug-panel figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      #debug-panel img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: var(--radius-sm);
        background: #000;
      }

      /* Edge-band strips are extreme long/thin rectangles (a ~20-40px thick
         band running the length of a guide edge) — after rotating so every
         one reads horizontally (see debugSteps.ts), scaling to the panel's
         full width the way other debug images do would still crush them to
         a sliver only a few pixels tall. Pin a legible fixed height instead
         and let width follow at that height's own (undistorted) aspect
         ratio; a figure narrower than its image scrolls horizontally rather
         than squeezing it. */
      #debug-panel .debug-step--edge-band {
        overflow-x: auto;
      }

      #debug-panel .debug-step--edge-band img {
        width: auto;
        height: 64px;
        max-width: none;
        /* #debug-panel figure is a column flex container, and flex items
           default to align-items: stretch on the cross axis (width, here) —
           that silently overrides `width: auto` above and stretches the
           image back out to the figure's full width, undoing the
           aspect-ratio-preserving sizing this rule exists for. Opting this
           one item out of stretch is what actually lets it size itself. */
        align-self: flex-start;
      }

      #debug-panel figcaption {
        font-size: 0.75rem;
        color: #aaa;
      }

      .debug-rejection-reason {
        margin: 0;
        padding: 0.5rem;
        border-radius: var(--radius-sm);
        background: rgba(255, 123, 123, 0.12);
        color: var(--danger);
        font-size: 0.8rem;
      }

      .debug-stage-heading {
        margin: 0;
        padding-top: 0.25rem;
        border-top: 1px solid #333;
        font-size: 0.8rem;
        font-weight: 600;
        color: #ccc;
      }

      .debug-stage-heading:first-child {
        border-top: none;
        padding-top: 0;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>TCG Scanner</h1>
      <p id="status">Loading OpenCV...</p>

      <div id="camera-stage">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="guide-overlay"></canvas>
      </div>

      <section id="settings" aria-label="Scan settings">
        <div class="setting-row">
          <label for="camera-select">Camera</label>
          <select id="camera-select" class="setting-select">
            <option value="">Detecting cameras…</option>
          </select>
        </div>
        <div class="setting-row">
          <label for="resolution-select">Resolution</label>
          <select id="resolution-select" class="setting-select"></select>
        </div>
        <p id="resolution-status">-</p>
        <div class="setting-row">
          <label for="format-select">Card format</label>
          <select id="format-select" class="setting-select">
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
        <div class="setting-row">
          <label class="debug-toggle" for="debug-checkbox">
            <input type="checkbox" id="debug-checkbox" />
            Debug mode
          </label>
          <div id="debug-controls" hidden>
            <button type="button" id="debug-force-button" disabled>Capture Debug Frame</button>
          </div>
        </div>
      </section>

      <div id="actions">
        <button type="button" id="scan-button">Start Scan</button>
      </div>

      <section id="result" hidden>
        <h2>Captured card</h2>
        <img id="result-image" alt="Flattened, cropped card capture" />
      </section>
    </main>

    <aside id="debug-panel" hidden></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
