<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Mirrors --bg: meta tags can't read CSS variables. -->
    <meta name="theme-color" content="#111111" />
    <title>TCG Scanner</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;

        /* Every UI color; canvas drawing reads them too (see paletteColor). */
        --bg: #111;
        --panel-bg: #1a1a1a;
        --panel-border: #2e2e2e;
        --control-bg: #222;
        --control-border: #444;
        --bar-bg: rgba(22, 22, 22, 0.82);
        --bar-border: rgba(255, 255, 255, 0.14);
        --media-bg: #000;
        --scrim: rgba(0, 0, 0, 0.85);
        --on-scrim: #fff;
        --text: #eee;
        --text-secondary: #ccc;
        --text-muted: #999;
        --tab-inactive: #8e8e93;
        --accent: #ffc107;
        --accent-text: #111;
        --accent-tint: rgba(255, 193, 7, 0.1);
        --danger: #ff7b7b;
        --danger-tint: rgba(255, 123, 123, 0.12);
        --warning: #ff9f43;
        --guide-not-found: rgba(239, 68, 68, 0.95);
        --guide-found: rgba(56, 224, 130, 0.95);
        --guide-flash: rgba(255, 255, 255, 0.95);
        --debug-text-profile: rgba(80, 200, 255, 0.8);
        --debug-line-profile: rgba(255, 150, 40, 0.8);

        --font-xs: 0.75rem;
        --font-sm: 0.85rem;
        /* Inputs stay at 1rem: smaller makes iOS Safari zoom in on focus. */
        --font-md: 1rem;
        --font-lg: 1.1rem;
        --font-mono: ui-monospace, monospace;

        --gap-xs: 0.25rem;
        --gap-sm: 0.5rem;
        --gap: 0.75rem;
        --radius-sm: 6px;
        --radius: 10px;
        --radius-pill: 999px;
        --tap: 2.75rem;
        --tap-lg: 3.25rem;
        --label-width: 6.5rem;
        --thumb-width: 8rem;
        --tab-bar-height: 49px;
      }

      /* ---- Base ---- */

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      h2,
      p {
        margin: 0;
      }

      h2 {
        font-size: var(--font-md);
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      :disabled {
        opacity: 0.4;
        cursor: default;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .hint {
        font-size: var(--font-sm);
        color: var(--text-muted);
      }

      .error {
        font-size: var(--font-sm);
        color: var(--danger);
      }

      /* ---- Layout ---- */

      #app {
        max-width: 480px;
        margin-inline: auto;
        padding: max(var(--gap), env(safe-area-inset-top)) max(var(--gap), env(safe-area-inset-right))
          calc(var(--tab-bar-height) + env(safe-area-inset-bottom) + var(--gap)) max(var(--gap), env(safe-area-inset-left));
      }

      .screen {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: var(--gap-sm);
        padding: var(--gap);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius);
        background: var(--panel-bg);
      }

      .tab-bar {
        position: fixed;
        inset: auto 0 0 0;
        z-index: 5;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        height: calc(var(--tab-bar-height) + env(safe-area-inset-bottom));
        padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: var(--bar-bg);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
        border-top: 0.5px solid var(--bar-border);
      }

      .tab-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 0;
        border: none;
        background: none;
        color: var(--tab-inactive);
        font-size: 10px;
        font-weight: 500;
        -webkit-tap-highlight-color: transparent;
      }

      .tab-item svg {
        width: 26px;
        height: 26px;
      }

      .tab-item[aria-current="page"] {
        color: var(--accent);
      }

      /* ---- Controls ---- */

      .button {
        min-height: var(--tap);
        padding: 0 var(--gap);
        border: 1px solid var(--control-border);
        border-radius: var(--radius-sm);
        background: var(--control-bg);
        color: var(--text);
        font-size: var(--font-sm);
      }

      .button-primary {
        min-height: var(--tap-lg);
        border: none;
        background: var(--accent);
        color: var(--accent-text);
        font-size: var(--font-lg);
        font-weight: 600;
      }

      .button-outline {
        border-color: var(--accent);
        background: var(--accent-tint);
        font-size: var(--font-md);
      }

      .button-danger {
        color: var(--danger);
      }

      .mono {
        font-family: var(--font-mono);
      }

      .input {
        width: 100%;
        min-height: var(--tap);
        padding: 0 var(--gap-sm);
        border: 1px solid var(--control-border);
        border-radius: var(--radius-sm);
        background: var(--control-bg);
        color: var(--text);
        font-size: var(--font-md);
      }

      .input[aria-invalid="true"] {
        border-color: var(--danger);
      }

      .field {
        display: grid;
        grid-template-columns: var(--label-width) minmax(0, 1fr);
        align-items: center;
        gap: var(--gap);
      }

      .field-auto {
        grid-template-columns: auto minmax(0, 1fr);
      }

      .field label,
      .checkbox-row {
        font-size: var(--font-sm);
        color: var(--text-secondary);
      }

      .field-note {
        padding-left: calc(var(--label-width) + var(--gap));
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: var(--gap-sm);
        min-height: var(--tap);
      }

      .checkbox-row input {
        width: 1.2rem;
        height: 1.2rem;
      }

      /* Radio/checkbox pill toggles; the input is invisible but stays focusable. */
      .segmented,
      .pill-toggle {
        display: flex;
        overflow: hidden;
        border: 1px solid var(--control-border);
        border-radius: var(--radius-pill);
        background: var(--control-bg);
      }

      .segmented label,
      .pill-toggle {
        position: relative;
        display: flex;
        align-items: center;
        min-height: var(--tap);
        padding: 0 var(--gap);
        color: var(--text-muted);
        font-size: var(--font-sm);
        cursor: pointer;
      }

      .segmented input,
      .pill-toggle input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .segmented label:has(input:checked),
      .pill-toggle:has(input:checked) {
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
      }

      .segmented label:has(input:focus-visible),
      .pill-toggle:has(input:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      /* ---- Camera ---- */

      /* --frame-aspect (set in app.ts) keeps the stage, and so the overlay
         canvas, the video's exact shape; the width shrinks to stay under 55%
         of the screen height. */
      #camera-stage {
        position: relative;
        aspect-ratio: var(--frame-aspect, 1.7778);
        width: min(100%, calc(55svh * var(--frame-aspect, 1.7778)));
        margin-inline: auto;
        overflow: hidden;
        border-radius: var(--radius);
        background: var(--media-bg);
      }

      #camera-video,
      #guide-overlay,
      #capture-flash {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #camera-video {
        object-fit: cover;
      }

      #capture-flash {
        background: var(--accent);
        opacity: 0;
        pointer-events: none;
      }

      .card-options {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: var(--gap-sm);
      }

      .card-options:not(:has(> :not([hidden]))) {
        display: none;
      }

      /* Sticks above the tab bar when scrolled out of view. */
      #actions {
        position: sticky;
        bottom: calc(var(--tab-bar-height) + env(safe-area-inset-bottom));
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: var(--gap-sm);
        padding: var(--gap-sm) 0;
        background: linear-gradient(to bottom, transparent, var(--bg) 35%);
      }

      #actions .button {
        width: 100%;
      }

      /* ---- Capture ---- */

      /* Fixed size, empty or not, so the layout never moves. */
      #capture {
        display: grid;
        grid-template-columns: var(--thumb-width) minmax(0, 1fr);
        grid-template-rows: 3.5rem var(--tap);
        gap: var(--gap-sm) var(--gap);
      }

      .thumb-slot {
        overflow: hidden;
        border: 1px solid var(--control-border);
        border-radius: var(--radius-sm);
      }

      #result {
        display: block;
        width: 100%;
        height: 100%;
        padding: 0;
        border: none;
        background: var(--media-bg);
        cursor: zoom-in;
      }

      #result img,
      #card-overlay img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      #result img {
        width: 100%;
        height: 100%;
      }

      .capture-text {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: var(--gap-xs);
        min-width: 0;
      }

      #status {
        display: -webkit-box;
        overflow: hidden;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        font-size: var(--font-sm);
        line-height: 1.25;
      }

      #status[data-kind="error"] {
        color: var(--danger);
      }

      #identification-warning {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--warning);
        font-size: var(--font-xs);
      }

      #identification-warning::before {
        content: "⚠ ";
      }

      /* Keeps its line when there's no warning. */
      #identification-warning[hidden] {
        display: block !important;
        visibility: hidden;
      }

      .match-buttons {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--gap-sm);
      }

      .match-buttons .button {
        min-width: 0;
        padding: 0 var(--gap-sm);
      }

      #card-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(var(--gap), env(safe-area-inset-top)) var(--gap) max(var(--gap), env(safe-area-inset-bottom));
        background: var(--scrim);
        cursor: zoom-out;
      }

      #card-overlay img {
        border-radius: var(--radius);
      }

      /* ---- Scanned cards ---- */

      /* The count lines up with #capture's text column (less this panel's padding and border). */
      .scanned-cards-header {
        display: grid;
        grid-template-columns: calc(var(--thumb-width) - var(--gap) - 1px) minmax(0, 1fr) auto;
        align-items: center;
        column-gap: var(--gap);
      }

      .scanned-cards-header h2 {
        white-space: nowrap;
      }

      .scanned-cards-actions,
      .manual-entry,
      .scanned-card-actions {
        display: flex;
        align-items: center;
        gap: var(--gap-sm);
      }

      .scanned-cards-actions {
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .manual-entry .input {
        flex: 1;
        min-width: 0;
      }

      #scanned-cards-list {
        max-height: 45svh;
        margin: 0;
        padding-left: 2.25rem;
        overflow-y: auto;
        font-size: var(--font-sm);
      }

      #scanned-cards-list li + li {
        border-top: 1px solid var(--panel-border);
      }

      #scanned-cards-list li::marker {
        color: var(--text-muted);
        font-size: var(--font-xs);
      }

      #scanned-cards-list summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: var(--tap);
        font-family: var(--font-mono);
        list-style: none;
        cursor: pointer;
      }

      #scanned-cards-list summary::-webkit-details-marker {
        display: none;
      }

      #scanned-cards-list summary::after {
        content: "▾";
        color: var(--text-muted);
        transition: transform 0.15s;
      }

      #scanned-cards-list details:not([open]) summary::after {
        transform: rotate(-90deg);
      }

      .scanned-card-facts {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: var(--gap-xs) var(--gap);
        margin: 0 0 var(--gap-sm);
        font-size: var(--font-sm);
      }

      .scanned-card-facts dt {
        color: var(--text-muted);
      }

      .scanned-card-facts dd {
        margin: 0;
        font-family: var(--font-mono);
        overflow-wrap: anywhere;
      }

      .scanned-card-actions {
        padding-bottom: var(--gap-sm);
      }

      .scanned-card-actions .button {
        flex: 0 0 var(--tap);
        padding: 0;
        font-size: var(--font-lg);
      }

      .scanned-card-quantity {
        min-width: 2.5rem;
        text-align: center;
        font-family: var(--font-mono);
        font-size: var(--font-lg);
        font-weight: 600;
      }

      /* ---- Debug panel ---- */

      #debug-panel {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }

      #debug-panel figure {
        display: flex;
        flex-direction: column;
        gap: var(--gap-xs);
        margin: 0;
      }

      #debug-panel img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: var(--radius-sm);
        background: var(--media-bg);
      }

      #debug-panel figcaption {
        color: var(--text-muted);
        font-size: var(--font-xs);
      }

      /* Edge bands are long thin strips: a fixed legible height, natural width,
         scrolling sideways instead of being squeezed to the panel width. */
      #debug-panel .debug-step--edge-band {
        overflow-x: auto;
      }

      #debug-panel .debug-step--edge-band img {
        width: auto;
        max-width: none;
        height: 64px;
        /* Otherwise the column flex parent stretches it back to full width. */
        align-self: flex-start;
      }

      .debug-rejection-reason {
        padding: var(--gap-sm);
        border-radius: var(--radius-sm);
        background: var(--danger-tint);
        color: var(--danger);
        font-size: var(--font-sm);
      }

      .debug-stage-heading {
        padding-top: var(--gap-xs);
        border-top: 1px solid var(--panel-border);
        color: var(--text-secondary);
        font-size: var(--font-sm);
        font-weight: 600;
      }

      .debug-stage-heading:first-child {
        padding-top: 0;
        border-top: none;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <section id="screen-scan" class="screen" aria-label="Scan">
        <div id="camera-stage">
          <video id="camera-video" autoplay playsinline muted></video>
          <canvas id="guide-overlay"></canvas>
          <div id="capture-flash"></div>
        </div>

        <div class="card-options">
          <div id="orientation-toggle" class="segmented" role="radiogroup" aria-label="Card orientation">
            <label><input type="radio" name="card-orientation" id="orientation-portrait" value="portrait" /> Portrait</label>
            <label><input type="radio" name="card-orientation" id="orientation-landscape" value="landscape" /> Landscape</label>
          </div>
          <label id="foil-toggle" class="pill-toggle"><input type="checkbox" id="foil-checkbox" /> Foil</label>
        </div>

        <div id="actions">
          <div id="debug-controls" hidden>
            <button type="button" id="debug-force-button" class="button" disabled>Capture Debug Frame</button>
          </div>
          <button type="button" id="scan-button" class="button button-primary">Start Scan</button>
        </div>

        <section id="capture" aria-label="Captured card">
          <div class="thumb-slot">
            <button type="button" id="result" aria-label="Show the full captured card" hidden>
              <img id="result-image" alt="Collector number as captured" />
            </button>
          </div>
          <div class="capture-text">
            <p id="status" role="status" aria-live="polite">Starting…</p>
            <p id="identification-warning" role="alert" hidden></p>
          </div>
          <div id="identification-matches" class="match-buttons"></div>
        </section>

        <div class="panel">
          <div class="field field-auto">
            <label for="tags-input">Tags</label>
            <input
              type="text"
              id="tags-input"
              class="input"
              placeholder="#box-01 #booster-01"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              enterkeyhint="done"
              aria-describedby="tags-error"
            />
          </div>
          <p id="tags-error" class="error" hidden></p>
        </div>

        <aside id="debug-panel" aria-label="Debug steps" hidden></aside>

        <section id="scanned-cards" class="panel">
          <div class="scanned-cards-header">
            <h2>Scanned cards</h2>
            <span id="scanned-cards-count" class="hint">0</span>
            <div class="scanned-cards-actions">
              <button type="button" id="scanned-cards-download" class="button" aria-label="Download CSV" title="Download CSV" disabled>CSV</button>
              <button type="button" id="scanned-cards-merge" class="button" title="Merge duplicate entries into one, adding up their quantities" disabled>Merge</button>
              <button type="button" id="scanned-cards-clear" class="button button-danger" disabled>Clear</button>
            </div>
          </div>
          <p id="scanned-cards-error" class="error" hidden></p>
          <form id="manual-entry" class="manual-entry" autocomplete="off">
            <label for="manual-entry-input" class="visually-hidden">Card number</label>
            <input
              type="text"
              id="manual-entry-input"
              class="input"
              list="manual-entry-options"
              placeholder="Card number, e.g. 005a"
              autocapitalize="off"
              spellcheck="false"
              enterkeyhint="done"
              aria-describedby="manual-entry-error"
            />
            <datalist id="manual-entry-options"></datalist>
            <button type="submit" class="button">Add</button>
          </form>
          <p id="manual-entry-error" class="error" hidden></p>
          <p id="scanned-cards-empty" class="hint">No cards yet — tap a best match after a scan, or type a card number.</p>
          <ol id="scanned-cards-list" reversed></ol>
        </section>
      </section>

      <section id="screen-game" class="screen" aria-label="Game and set" hidden>
        <div class="panel">
          <div class="field">
            <label for="game-select">Game</label>
            <select id="game-select" class="input"></select>
          </div>
          <div class="field">
            <label for="set-select">Set</label>
            <select id="set-select" class="input"></select>
          </div>
        </div>
      </section>

      <section id="screen-settings" class="screen" aria-label="Settings" hidden>
        <div class="panel">
          <div class="field">
            <label for="camera-select">Camera</label>
            <select id="camera-select" class="input">
              <option value="">Detecting cameras…</option>
            </select>
          </div>
          <div class="field">
            <label for="resolution-select">Resolution</label>
            <select id="resolution-select" class="input"></select>
          </div>
          <p id="resolution-status" class="hint field-note">-</p>
          <label class="checkbox-row" for="sound-checkbox">
            <input type="checkbox" id="sound-checkbox" />
            Sound
          </label>
          <label class="checkbox-row" for="debug-checkbox">
            <input type="checkbox" id="debug-checkbox" />
            Debug mode
          </label>
        </div>
      </section>
    </main>

    <nav class="tab-bar" aria-label="Screens">
      <button type="button" id="tab-scan" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2" />
          <rect x="9" y="7.5" width="6" height="9" rx="1" />
        </svg>
        Scan
      </button>
      <button type="button" id="tab-game" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="3" width="11" height="15" rx="2" />
          <path d="M6 6.5v11A3.5 3.5 0 0 0 9.5 21H16" />
        </svg>
        Game
      </button>
      <button type="button" id="tab-settings" class="tab-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1" />
          <circle cx="15" cy="6" r="2" />
          <circle cx="9" cy="12" r="2" />
          <circle cx="17" cy="18" r="2" />
        </svg>
        Settings
      </button>
    </nav>

    <div id="card-overlay" role="dialog" aria-label="Captured card — tap to close" hidden>
      <img id="card-overlay-image" alt="Full captured card" />
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
