<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TCG Scanner</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        padding: 1rem;
        background: #111;
        color: #eee;
        display: flex;
        justify-content: center;
        gap: 1rem;
        align-items: flex-start;
      }

      #app {
        max-width: 480px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      h1 {
        font-size: 1.1rem;
        margin: 0;
      }

      #status {
        min-height: 1.2em;
        margin: 0;
        font-size: 0.9rem;
      }

      #status[data-kind="error"] {
        color: #ff7b7b;
      }

      #camera-stage {
        position: relative;
        width: 100%;
        /* Initial guess before the video's real dimensions are known —
           matches every CAMERA_RESOLUTION_OPTIONS entry's own 16:9 shape
           (config.ts). Kept in sync with the live video's actual intrinsic
           size in JS (src/shell/app.ts) once it loads, so the guide-overlay
           canvas — sized to that same intrinsic pixel dimensions — maps 1:1
           onto the video with no letterboxing/cropping mismatch between the
           two. */
        aspect-ratio: 16 / 9;
        background: #000;
        overflow: hidden;
        border-radius: 8px;
      }

      #camera-video,
      #guide-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #camera-video {
        object-fit: cover;
      }

      #controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      #resolution-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        font-size: 0.85rem;
        color: #ccc;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .format-select {
        padding: 0.4rem 0.75rem;
        border: 1px solid #555;
        background: #222;
        color: #eee;
        border-radius: 6px;
      }

      #scan-button {
        padding: 0.6rem 1.25rem;
        font-size: 1rem;
        border-radius: 8px;
        border: none;
        background: #38e082;
        color: #111;
        font-weight: 600;
      }

      #scan-button:disabled {
        background: #555;
        color: #999;
      }

      #result {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      #result[hidden] {
        display: none;
      }

      #result img {
        max-width: 100%;
        border-radius: 8px;
        background: #000;
      }

      .debug-toggle {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.9rem;
      }

      #debug-controls {
        display: flex;
        justify-content: flex-end;
      }

      #debug-controls[hidden] {
        display: none;
      }

      #debug-force-button {
        padding: 0.4rem 0.75rem;
        font-size: 0.85rem;
        border: 1px solid #555;
        background: #222;
        color: #eee;
        border-radius: 6px;
      }

      #debug-force-button:disabled {
        color: #666;
        border-color: #333;
      }

      #debug-panel {
        width: 220px;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      #debug-panel[hidden] {
        display: none;
      }

      #debug-panel figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      #debug-panel img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 6px;
        background: #000;
      }

      /* Edge-band strips are extreme long/thin rectangles (a ~20-40px thick
         band running the length of a guide edge) — after rotating so every
         one reads horizontally (see debugSteps.ts), scaling to the panel's
         full width the way other debug images do would still crush them to
         a sliver only a few pixels tall. Pin a legible fixed height instead
         and let width follow at that height's own (undistorted) aspect
         ratio; a figure narrower than its image scrolls horizontally rather
         than squeezing it. */
      #debug-panel .debug-step--edge-band {
        overflow-x: auto;
      }

      #debug-panel .debug-step--edge-band img {
        width: auto;
        height: 64px;
        max-width: none;
        /* #debug-panel figure is a column flex container, and flex items
           default to align-items: stretch on the cross axis (width, here) —
           that silently overrides `width: auto` above and stretches the
           image back out to the figure's full width, undoing the
           aspect-ratio-preserving sizing this rule exists for. Opting this
           one item out of stretch is what actually lets it size itself. */
        align-self: flex-start;
      }

      #debug-panel figcaption {
        font-size: 0.75rem;
        color: #aaa;
      }

      .debug-rejection-reason {
        margin: 0;
        padding: 0.5rem;
        border-radius: 6px;
        background: rgba(255, 123, 123, 0.12);
        color: #ff7b7b;
        font-size: 0.8rem;
      }

      .debug-stage-heading {
        margin: 0;
        padding-top: 0.25rem;
        border-top: 1px solid #333;
        font-size: 0.8rem;
        font-weight: 600;
        color: #ccc;
      }

      .debug-stage-heading:first-child {
        border-top: none;
        padding-top: 0;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>TCG Scanner</h1>
      <p id="status">Loading OpenCV...</p>

      <div id="camera-stage">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="guide-overlay"></canvas>
      </div>

      <div id="resolution-row">
        <span id="resolution-status">Resolution: —</span>
        <label>
          <span class="visually-hidden">Camera resolution</span>
          <select id="resolution-select" class="format-select"></select>
        </label>
      </div>

      <div id="controls">
        <label>
          <span class="visually-hidden">Card print format</span>
          <select id="format-select" class="format-select">
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </label>
        <label class="debug-toggle">
          <input type="checkbox" id="debug-checkbox" />
          Debug
        </label>
        <button type="button" id="scan-button">Start Scan</button>
      </div>

      <div id="debug-controls" hidden>
        <button type="button" id="debug-force-button" disabled>Capture Debug Frame</button>
      </div>

      <section id="result" hidden>
        <h2>Captured card</h2>
        <img id="result-image" alt="Flattened, cropped card capture" />
      </section>
    </main>

    <aside id="debug-panel" hidden></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
