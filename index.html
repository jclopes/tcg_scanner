<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111111" />
    <title>TCG Scanner</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        --bg: #111;
        --panel-bg: #1a1a1a;
        --panel-border: #2e2e2e;
        --text: #eee;
        --text-muted: #999;
        --accent: #38e082;
        --accent-text: #111;
        --danger: #ff7b7b;
        --control-bg: #222;
        --control-border: #444;
        --radius: 10px;
        --radius-sm: 6px;
        --gap: 0.75rem;
        /* Comfortable touch target height. */
        --tap: 2.75rem;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0.75rem max(0.75rem, env(safe-area-inset-right)) 0 max(0.75rem, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--text);
        display: flex;
        justify-content: center;
        gap: 1rem;
        align-items: flex-start;
      }

      #app {
        max-width: 480px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      h1 {
        font-size: 1rem;
        margin: 0;
        color: var(--text-muted);
        font-weight: 600;
      }

      h2 {
        font-size: 0.95rem;
        margin: 0;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        padding: 0.75rem;
        border: 1px solid var(--panel-border);
        border-radius: var(--radius);
        background: var(--panel-bg);
      }

      .panel[hidden] {
        display: none;
      }

      .secondary-button {
        min-height: 2.25rem;
        padding: 0.35rem 0.75rem;
        font-size: 0.85rem;
        border: 1px solid var(--control-border);
        background: var(--control-bg);
        color: var(--text);
        border-radius: var(--radius-sm);
      }

      .secondary-button:disabled {
        color: #666;
        border-color: #333;
      }

      /* ---- Camera ---------------------------------------------------------- */

      #camera-stage {
        position: relative;
        /* --frame-aspect is the live video's width / height, set from JS
           (src/shell/app.ts) once it loads; 16:9 until then. The stage keeps
           exactly that shape — so the guide-overlay canvas, sized to the
           video's intrinsic pixels, maps 1:1 onto the video — and shrinks
           its width rather than its height to stay under 55% of the screen
           height, so a portrait phone camera doesn't push everything else
           off-screen. */
        aspect-ratio: var(--frame-aspect, 1.7778);
        width: min(100%, calc(55svh * var(--frame-aspect, 1.7778)));
        margin-inline: auto;
        background: #000;
        overflow: hidden;
        border-radius: var(--radius);
      }

      #camera-video,
      #guide-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #camera-video {
        object-fit: cover;
      }

      #status {
        min-height: 1.2em;
        margin: 0;
        font-size: 0.9rem;
        color: var(--text-muted);
        text-align: center;
      }

      #status[data-kind="error"] {
        color: var(--danger);
      }

      /* Stays reachable at the bottom of the screen whenever its normal spot
         is scrolled out of view below. */
      #actions {
        position: sticky;
        bottom: 0;
        z-index: 1;
        padding: 0.5rem 0 max(0.5rem, env(safe-area-inset-bottom));
        background: linear-gradient(to bottom, transparent, var(--bg) 35%);
      }

      .card-options {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }

      .card-options:not(:has(> :not([hidden]))) {
        display: none;
      }

      .card-options [hidden] {
        display: none;
      }

      /* Radio buttons / checkbox shown as pill toggles; the input itself is
         visually hidden but stays focusable. */
      .segmented,
      .foil-toggle {
        display: flex;
        border: 1px solid var(--control-border);
        border-radius: 999px;
        overflow: hidden;
        background: var(--control-bg);
      }

      .segmented label,
      .foil-toggle {
        position: relative;
        display: flex;
        align-items: center;
        min-height: 2.5rem;
        padding: 0 1rem;
        font-size: 0.9rem;
        color: var(--text-muted);
        cursor: pointer;
      }

      .segmented input,
      .foil-toggle input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .segmented label:has(input:checked),
      .foil-toggle:has(input:checked) {
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
      }

      .segmented label:has(input:focus-visible),
      .foil-toggle:has(input:focus-visible) {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      #scan-button {
        width: 100%;
        min-height: 3.25rem;
        padding: 0.7rem 1.25rem;
        font-size: 1.05rem;
        font-weight: 600;
        border-radius: var(--radius);
        border: none;
        background: var(--accent);
        color: var(--accent-text);
      }

      #scan-button:disabled {
        background: #555;
        color: #999;
      }

      /* ---- Capture: thumbnail + identification ----------------------------- */

      #capture {
        display: flex;
        align-items: flex-start;
        gap: var(--gap);
      }

      #capture:has(> #result[hidden]):has(> #identification[hidden]) {
        display: none;
      }

      #result {
        flex: 0 0 auto;
        margin: 0;
      }

      #result[hidden] {
        display: none;
      }

      #result img {
        display: block;
        width: 8rem;
        height: auto;
        border-radius: var(--radius-sm);
        background: #000;
      }

      #identification {
        flex: 1 1 auto;
        min-width: 0;
        padding: 0;
        border: none;
        background: none;
        gap: 0.4rem;
      }

      #identification-status {
        margin: 0;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      #identification-warning {
        margin: 0;
        padding: 0.4rem 0.6rem;
        border-radius: var(--radius-sm);
        background: rgba(255, 196, 0, 0.12);
        color: #ffc400;
        font-size: 0.8rem;
      }

      #identification-warning[hidden] {
        display: none;
      }

      #identification-results {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: baseline;
        gap: 0.3rem 0.6rem;
      }

      #identification-results dt {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      #identification-results dd {
        margin: 0;
        font-size: 0.9rem;
        font-family: ui-monospace, monospace;
        overflow-wrap: anywhere;
      }

      /* The match buttons get the full width below the OCR rows. */
      #identification-results dd:has(.match-buttons) {
        grid-column: 1 / -1;
      }

      #identification-results dt:has(+ dd .match-buttons) {
        grid-column: 1 / -1;
        margin-top: 0.2rem;
      }

      .match-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .match-button {
        flex: 1 1 6rem;
        min-height: var(--tap);
        padding: 0.4rem 0.7rem;
        font-family: ui-monospace, monospace;
        font-size: 0.95rem;
        border: 1px solid var(--accent);
        background: rgba(56, 224, 130, 0.08);
        color: var(--text);
        border-radius: var(--radius-sm);
        cursor: pointer;
      }

      /* ---- Settings -------------------------------------------------------- */

      details.panel {
        gap: 0;
        padding: 0;
      }

      details.panel > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: var(--tap);
        padding: 0 0.75rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        list-style: none;
      }

      details.panel > summary::-webkit-details-marker {
        display: none;
      }

      details.panel > summary::after {
        content: "▾";
        color: var(--text-muted);
        transition: transform 0.15s;
      }

      details.panel:not([open]) > summary::after {
        transform: rotate(-90deg);
      }

      .panel-body {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        padding: 0 0.75rem 0.75rem;
      }

      .setting-row {
        display: grid;
        grid-template-columns: 6.5rem minmax(0, 1fr);
        align-items: center;
        gap: var(--gap);
      }

      .setting-row label {
        font-size: 0.85rem;
        color: #ccc;
      }

      /* 1rem font keeps iOS Safari from zooming in when a control is focused. */
      .setting-select {
        width: 100%;
        min-height: var(--tap);
        padding: 0.4rem 0.6rem;
        font-size: 1rem;
        border: 1px solid var(--control-border);
        background: var(--control-bg);
        color: var(--text);
        border-radius: var(--radius-sm);
      }

      .setting-select:disabled {
        opacity: 0.6;
      }

      .setting-note {
        margin: -0.3rem 0 0;
        font-size: 0.8rem;
        color: var(--text-muted);
        text-align: right;
      }

      #tags-input[aria-invalid="true"] {
        border-color: var(--danger);
      }

      .tag-suggestions {
        display: flex;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin-top: -0.2rem;
      }

      .tag-suggestion {
        min-height: 2rem;
        padding: 0.2rem 0.7rem;
        font-size: 0.85rem;
        font-family: ui-monospace, monospace;
        border: 1px solid var(--control-border);
        background: var(--control-bg);
        color: var(--text-muted);
        border-radius: 999px;
        cursor: pointer;
      }

      #tags-error {
        margin: 0;
        font-size: 0.8rem;
        color: var(--danger);
        text-align: right;
      }

      #tags-error[hidden] {
        display: none;
      }

      .debug-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-height: var(--tap);
        font-size: 0.85rem;
        color: #ccc;
      }

      .debug-toggle input {
        width: 1.2rem;
        height: 1.2rem;
      }

      .debug-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--gap);
      }

      #debug-controls[hidden] {
        display: none;
      }

      /* ---- Scanned cards --------------------------------------------------- */

      .scanned-cards-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .scanned-cards-actions {
        display: flex;
        gap: 0.4rem;
      }

      #scanned-cards-clear:not(:disabled),
      .danger-button {
        color: var(--danger);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .manual-entry {
        display: flex;
        gap: 0.5rem;
      }

      .manual-entry input {
        flex: 1 1 auto;
        min-width: 0;
      }

      .manual-entry button {
        min-height: var(--tap);
        min-width: 4.5rem;
      }

      #manual-entry-input[aria-invalid="true"] {
        border-color: var(--danger);
      }

      #manual-entry-error {
        margin: -0.3rem 0 0;
        font-size: 0.8rem;
        color: var(--danger);
      }

      #manual-entry-error[hidden] {
        display: none;
      }

      #scanned-cards-empty {
        margin: 0;
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      #scanned-cards-empty[hidden] {
        display: none;
      }

      #scanned-cards-list {
        margin: 0;
        padding-left: 2.25rem;
        max-height: 45svh;
        overflow-y: auto;
        font-size: 0.9rem;
      }

      #scanned-cards-list li {
        border-bottom: 1px solid var(--panel-border);
      }

      #scanned-cards-list li:last-child {
        border-bottom: none;
      }

      #scanned-cards-list li::marker {
        color: var(--text-muted);
        font-size: 0.8rem;
      }

      #scanned-cards-list summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: var(--tap);
        font-family: ui-monospace, monospace;
        cursor: pointer;
        list-style: none;
      }

      #scanned-cards-list summary::-webkit-details-marker {
        display: none;
      }

      #scanned-cards-list summary::after {
        content: "▾";
        color: var(--text-muted);
        transition: transform 0.15s;
      }

      #scanned-cards-list details:not([open]) summary::after {
        transform: rotate(-90deg);
      }

      .scanned-card-facts {
        margin: 0 0 0.5rem;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.25rem 0.75rem;
        font-size: 0.85rem;
      }

      .scanned-card-facts dt {
        color: var(--text-muted);
      }

      .scanned-card-facts dd {
        margin: 0;
        font-family: ui-monospace, monospace;
        overflow-wrap: anywhere;
      }

      .scanned-card-actions {
        display: flex;
        gap: 0.5rem;
        padding-bottom: 0.6rem;
      }

      .scanned-card-actions button {
        flex: 1 1 0;
        min-height: var(--tap);
      }

      /* ---- Debug panel ----------------------------------------------------- */

      #debug-panel {
        width: 220px;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      #debug-panel[hidden] {
        display: none;
      }

      #debug-panel figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      #debug-panel img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: var(--radius-sm);
        background: #000;
      }

      /* Edge-band strips are extreme long/thin rectangles (a ~20-40px thick
         band running the length of a guide edge) — after rotating so every
         one reads horizontally (see debugSteps.ts), scaling to the panel's
         full width the way other debug images do would still crush them to
         a sliver only a few pixels tall. Pin a legible fixed height instead
         and let width follow at that height's own (undistorted) aspect
         ratio; a figure narrower than its image scrolls horizontally rather
         than squeezing it. */
      #debug-panel .debug-step--edge-band {
        overflow-x: auto;
      }

      #debug-panel .debug-step--edge-band img {
        width: auto;
        height: 64px;
        max-width: none;
        /* #debug-panel figure is a column flex container, and flex items
           default to align-items: stretch on the cross axis (width, here) —
           that silently overrides `width: auto` above and stretches the
           image back out to the figure's full width, undoing the
           aspect-ratio-preserving sizing this rule exists for. Opting this
           one item out of stretch is what actually lets it size itself. */
        align-self: flex-start;
      }

      #debug-panel figcaption {
        font-size: 0.75rem;
        color: #aaa;
      }

      .debug-rejection-reason {
        margin: 0;
        padding: 0.5rem;
        border-radius: var(--radius-sm);
        background: rgba(255, 123, 123, 0.12);
        color: var(--danger);
        font-size: 0.8rem;
      }

      .debug-stage-heading {
        margin: 0;
        padding-top: 0.25rem;
        border-top: 1px solid #333;
        font-size: 0.8rem;
        font-weight: 600;
        color: #ccc;
      }

      .debug-stage-heading:first-child {
        border-top: none;
        padding-top: 0;
      }

      /* ---- Narrow screens -------------------------------------------------- */

      @media (max-width: 720px) {
        /* The debug panel stacks under the app instead of beside it. */
        body {
          flex-direction: column;
          align-items: center;
        }

        #debug-panel {
          width: 100%;
          max-width: 480px;
          padding-bottom: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <h1>TCG Scanner</h1>

      <div id="camera-stage">
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="guide-overlay"></canvas>
      </div>

      <p id="status" role="status" aria-live="polite">Loading OpenCV...</p>

      <div id="actions">
        <div class="card-options">
          <div id="format-toggle" class="segmented" role="radiogroup" aria-label="Card format">
            <label><input type="radio" name="card-format" id="format-portrait" value="portrait" /> Portrait</label>
            <label><input type="radio" name="card-format" id="format-landscape" value="landscape" /> Landscape</label>
          </div>
          <label id="foil-toggle" class="foil-toggle"><input type="checkbox" id="foil-checkbox" /> Foil</label>
        </div>
        <button type="button" id="scan-button">Start Scan</button>
      </div>

      <div id="capture">
        <figure id="result" hidden>
          <img id="result-image" alt="Flattened, cropped card capture" />
        </figure>
        <section id="identification" class="panel" aria-label="Identification" hidden>
          <p id="identification-status"></p>
          <p id="identification-warning" role="alert" hidden></p>
          <dl id="identification-results"></dl>
        </section>
      </div>

      <details class="panel" open>
        <summary>Session</summary>
        <div class="panel-body">
          <div class="setting-row">
            <label for="game-select">Game</label>
            <select id="game-select" class="setting-select"></select>
          </div>
          <div class="setting-row">
            <label for="set-select">Set</label>
            <select id="set-select" class="setting-select"></select>
          </div>
          <div class="setting-row">
            <label for="tags-input">Tags</label>
            <input
              type="text"
              id="tags-input"
              class="setting-select"
              placeholder="#box-01 #booster-01"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              enterkeyhint="done"
              aria-describedby="tags-error"
            />
          </div>
          <div id="tag-suggestions" class="tag-suggestions" aria-label="Suggested tags"></div>
          <p id="tags-error" hidden></p>
        </div>
      </details>

      <section id="scanned-cards" class="panel">
        <div class="scanned-cards-header">
          <h2>Scanned cards</h2>
          <div class="scanned-cards-actions">
            <button type="button" id="scanned-cards-download" class="secondary-button" disabled>Download CSV</button>
            <button type="button" id="scanned-cards-clear" class="secondary-button" disabled>Clear</button>
          </div>
        </div>
        <form id="manual-entry" class="manual-entry" autocomplete="off">
          <label for="manual-entry-input" class="visually-hidden">Card number</label>
          <input
            type="text"
            id="manual-entry-input"
            class="setting-select"
            list="manual-entry-options"
            placeholder="Card number, e.g. 005a"
            autocapitalize="off"
            spellcheck="false"
            enterkeyhint="done"
            aria-describedby="manual-entry-error"
          />
          <datalist id="manual-entry-options"></datalist>
          <button type="submit" class="secondary-button">Add</button>
        </form>
        <p id="manual-entry-error" hidden></p>
        <p id="scanned-cards-empty">No cards yet — tap a best match after a scan, or type a card number.</p>
        <ol id="scanned-cards-list" reversed></ol>
      </section>

      <details class="panel">
        <summary>Camera &amp; advanced</summary>
        <div class="panel-body">
          <div class="setting-row">
            <label for="camera-select">Camera</label>
            <select id="camera-select" class="setting-select">
              <option value="">Detecting cameras…</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="resolution-select">Resolution</label>
            <select id="resolution-select" class="setting-select"></select>
          </div>
          <p id="resolution-status" class="setting-note">-</p>
          <div class="debug-row">
            <label class="debug-toggle" for="debug-checkbox">
              <input type="checkbox" id="debug-checkbox" />
              Debug mode
            </label>
            <div id="debug-controls" hidden>
              <button type="button" id="debug-force-button" class="secondary-button" disabled>Capture Debug Frame</button>
            </div>
          </div>
        </div>
      </details>
    </main>

    <aside id="debug-panel" hidden></aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
